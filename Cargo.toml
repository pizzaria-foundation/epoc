[workspace]
resolver = "2"
members = [
    "crates/symbian-gfx",
    "crates/symbian-ui",
    "crates/symbian-decl-ui",
    "crates/symbian-keys",
    "crates/symbian-sys",
    "crates/opus",
    "crates/symbian",
    "crates/symbian-sim",
    "crates/symbian-app",
    "crates/symbian-audio",
    "crates/symbian-preview",
    "crates/symbian-crypto",
    "crates/symbian-layout",
    "crates/symbian-dom",
    "crates/symbian-report",
    "crates/symbian-mtm",
    "crates/symbian-json",
    "crates/symbian-bootcfg",
    "crates/symbian-bootctl",
    "crates/symbian-pkgui",
    "examples/netprobe",
    "examples/selftest",
    "examples/imgprobe",
    "examples/audioprobe",
    "examples/sqlprobe",
    "apps/cpuprobe",
    "apps/devdump",
    "apps/urlprobe",
    "apps/cenrepdump",
    "apps/httpprobe",
    "apps/ghprobe",
    "apps/startprobe",
    "apps/domprobe",
    "apps/gpsprobe",
    "apps/tileprobe",
    "apps/uigallery",
    "apps/skinprobe",
    "tools/preview",
]
# Every app's device crate is deliberately absent: a no_std staticlib carrying a
# #[panic_handler] collides with std's when cargo builds the test harness, so each one is its
# own workspace root, built only for the ARM target. See any device/Cargo.toml.
exclude = ["apps/skinprobe/device", "apps/uigallery/device", "apps/gpsprobe/device", "apps/tileprobe/device", "apps/domprobe/device", "apps/startprobe/device", "apps/httpprobe/device", "apps/ghprobe/device", "apps/tlsprobe/device", "apps/cenrepdump/device", "apps/urlprobe/device", 
    "examples/selftest/device",
    "examples/netprobe/device",
    "apps/cpuprobe/device",
    "apps/devdump/device",
    "apps/devdump/probes/system/device",
    "apps/devdump/probes/libsweep/device",
    "apps/devdump/probes/caps/device",
    "apps/devdump/probes/dll/device",
    "apps/devdump/probes/net/device",
    "apps/devdump/probes/bt/device",
    "apps/devdump/probes/fs/device",
    "apps/devdump/probes/msg/device",
    "apps/devdump/probes/mtm/device",
    "apps/devdump/probes/ncn/device",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/pizzaria-foundation/epoc"
rust-version = "1.85"

[workspace.dependencies]
symbian-gfx = { path = "crates/symbian-gfx", default-features = false }
symbian-ui = { path = "crates/symbian-ui", default-features = false }
symbian-decl-ui = { path = "crates/symbian-decl-ui", default-features = false }
symbian-keys = { path = "crates/symbian-keys" }
symbian-sys = { path = "crates/symbian-sys" }
symbian = { path = "crates/symbian" }
symbian-sim = { path = "crates/symbian-sim" }
symbian-app = { path = "crates/symbian-app" }
symbian-audio = { path = "crates/symbian-audio" }
symbian-preview = { path = "crates/symbian-preview" }
symbian-crypto = { path = "crates/symbian-crypto" }
symbian-layout = { path = "crates/symbian-layout", default-features = false }
symbian-dom = { path = "crates/symbian-dom", default-features = false }
symbian-report = { path = "crates/symbian-report" }
symbian-mtm = { path = "crates/symbian-mtm" }
symbian-json = { path = "crates/symbian-json" }
symbian-bootcfg = { path = "crates/symbian-bootcfg" }
symbian-bootctl = { path = "crates/symbian-bootctl" }
symbian-pkgui = { path = "crates/symbian-pkgui" }
devdump = { path = "apps/devdump" }
opus = { path = "crates/opus" }
selftest = { path = "examples/selftest" }
netprobe = { path = "examples/netprobe" }

# Small binaries matter a lot on a device with ~30 MB of usable RAM and a
# ~100 KB-per-page demand loader. These settings apply to the device profile;
# the host preview tool is unaffected in practice.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
debug = false
overflow-checks = false

