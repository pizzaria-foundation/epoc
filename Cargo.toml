[workspace]
resolver = "2"
members = [
    "crates/symbian-gfx",
    "crates/symbian-ui",
    "crates/symbian-keys",
    "crates/symbian-sys",
    "crates/opus",
    "crates/symbian",
    "crates/epocadb",
    "crates/symbian-sim",
    "crates/symbian-app",
    "crates/symbian-audio",
    "crates/symbian-preview",
    "crates/symbian-crypto",
    "crates/symbian-report",
    "examples/netprobe",
    "examples/selftest",
    "examples/imgprobe",
    "examples/audioprobe",
    "examples/sqlprobe",
    "apps/devdump",
    "tools/preview",
]
# Every app's device crate is deliberately absent: a no_std staticlib carrying a
# #[panic_handler] collides with std's when cargo builds the test harness, so each one is its
# own workspace root, built only for the ARM target. See any device/Cargo.toml.
exclude = [
    "examples/selftest/device",
    "examples/netprobe/device",
    "apps/devdump/device",
    "apps/devdump/probes/system/device",
    "apps/devdump/probes/libsweep/device",
    "apps/devdump/probes/caps/device",
    "apps/devdump/probes/dll/device",
    "apps/devdump/probes/net/device",
    "apps/devdump/probes/fs/device",
    "apps/devdump/probes/msg/device",
    "apps/devdump/probes/mtm/device",
    "apps/devdump/probes/ncn/device",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Lab2021/epoc"
rust-version = "1.85"

[workspace.dependencies]
symbian-gfx = { path = "crates/symbian-gfx", default-features = false }
symbian-ui = { path = "crates/symbian-ui", default-features = false }
symbian-keys = { path = "crates/symbian-keys" }
symbian-sys = { path = "crates/symbian-sys" }
symbian = { path = "crates/symbian" }
symbian-sim = { path = "crates/symbian-sim" }
symbian-app = { path = "crates/symbian-app" }
symbian-audio = { path = "crates/symbian-audio" }
symbian-preview = { path = "crates/symbian-preview" }
symbian-crypto = { path = "crates/symbian-crypto" }
symbian-report = { path = "crates/symbian-report" }
devdump = { path = "apps/devdump" }
opus = { path = "crates/opus" }
epocadb = { path = "crates/epocadb" }
selftest = { path = "examples/selftest" }
netprobe = { path = "examples/netprobe" }

# Small binaries matter a lot on a device with ~30 MB of usable RAM and a
# ~100 KB-per-page demand loader. These settings apply to the device profile;
# the host preview tool is unaffected in practice.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
debug = false
overflow-checks = false

