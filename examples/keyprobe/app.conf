# A diagnostic app: shows the raw key data the window server delivers.
#
# Exists because the E72's QWERTY has digits on the letter keys, and a key with a
# digit printed on it was reported as producing the digit. Which layer decides that
# — the window server's translation, a modifier we are misreading, or our own
# mapping table — is not something to guess at. This prints all three.

NAME=keyprobe
VENDOR="RustSdkDev"
VERSION=0,1,0

# Its own UID so it installs alongside the chat rather than replacing it.
UID3=0xE123456A

CAPABILITIES=none
USE_SHIM=1
# Raw key capture in the shim -> C:\\Data\\keyprobe.txt (every OfferKeyEventL, even the down/up
# edges the normal path drops) so a Ctrl chord that yields no translated char is still visible.
USE_KEYLOG=1
# Clipboard so this probe can preload a test string for the paste test in cal.
USE_CLIPBOARD=1
CXX_SOURCES=""
RUST_CRATE=device

HEAP=0x1000,0x200000
STACK=0x8000
SIGN=1
