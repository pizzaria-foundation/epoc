# Build manifest, read by tools/symbuild.

NAME=audioprobe
VENDOR="RustSdkDev"
VERSION=0,1,0

# Its own UID in the unprotected 0xE development block, so it installs alongside the
# Telegram client and the image probe rather than over either.
UID3=0xE1234571

# WriteUserData so the report can land in C:\Data\, the one place on this handset that is
# both writable and reachable over Bluetooth. Playback itself needs no capability at all:
# the SDK's capability report lists UserEnvironment against recording only, and the shipped
# CLFExample plays audio under `capability none`. MultimediaDD appears against the
# priority-taking overloads but grants precedence rather than access.
CAPABILITIES="WriteUserData"

USE_SHIM=1
# The whole point of this binary, and the reason it is a binary: the mediaclientaudio.dll
# import lands here rather than in something with other work to do.
USE_AUDIO=1
# No image decoding and no network. A probe that asks one question should not be able to
# fail for a second reason.
USE_IMAGE=0
USE_NET=0

# No C++ of its own, unlike imgprobe. That probe needed it because the matrix varied things
# the shim ABI deliberately does not expose — decoder options, a forced plugin UID. Here the
# matrix varies sample rate, channel count and directory, all of which are just bytes in a
# file and a path, so the probe exercises the real shim_audio.cpp rather than a copy of it.
# That is a better instrument: what it measures is the code that will ship.
RUST_CRATE=device

HEAP=0x1000,0x400000
STACK=0x8000

# The dev handset runs a patched installserver; see tools/symbuild.
SIGN=0
