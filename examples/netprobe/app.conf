# Build manifest, read by tools/symbuild.

NAME=netprobe
VENDOR="Pizzaria Foundation"
VERSION=0,1,0

# 0xE is the unprotected development block. This one value becomes three things that must
# agree: the E32 header UID3, the UID3 in data/netprobe_reg.rss, and KUidShimApp in the
# shim (via -DSHIM_APP_UID3). symbuild wires all three.
UID3=0xECBBFB06

# Declare only what the binary uses. A capability an app does not need is a capability the
# user is asked to trust for no reason — and an unsigned package declaring a protected one
# will not install on a stock phone at all.
# The only capability any of this needs, and it is user-grantable — a self-signed
# package can have it.
CAPABILITIES=NetworkServices

USE_SHIM=1

# Opts the socket layer and the worker thread into the build. Without it shim_net.cpp
# and shim_work.cpp are not compiled and the network libraries are not linked, so an
# app that does not use them does not import the socket server.
USE_NET=1
CXX_SOURCES=""
RUST_CRATE=device

HEAP=0x1000,0x200000
STACK=0x8000

# The dev handset runs a patched installserver; see tools/symbuild.
SIGN=0
