# Build manifest, read by tools/symbuild.

NAME=selftest
VENDOR="Pizzaria Foundation"
VERSION=0,1,0

# 0xE is the unprotected development block. This one value becomes three things that must
# agree: the E32 header UID3, the UID3 in data/selftest_reg.rss, and KUidShimApp in the
# shim (via -DSHIM_APP_UID3). symbuild wires all three.
UID3=0xED036DB6

# Declare only what the binary uses. A capability an app does not need is a capability the
# user is asked to trust for no reason — and an unsigned package declaring a protected one
# will not install on a stock phone at all.
# NetworkServices for the sockets; WriteUserData so the report can land somewhere the
# user can actually reach. The app's own private directory needs no capability but is
# invisible to the file manager and to USB mass storage, which makes it useless for a
# report whose whole purpose is to be carried off the device.
# Quoted, and joined with + : unquoted the shell reads the space as the end of the
# assignment and tries to run the second word as a command, and elf2e32 wants a
# +-separated list rather than a space-separated one.
CAPABILITIES="NetworkServices+WriteUserData"

USE_SHIM=1
USE_NET=1
CXX_SOURCES=""
RUST_CRATE=device

HEAP=0x1000,0x600000
STACK=0x8000

# The dev handset runs a patched installserver; see tools/symbuild.
SIGN=0
