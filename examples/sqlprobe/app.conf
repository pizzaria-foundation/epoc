# Build manifest, read by tools/symbuild.

NAME=sqlprobe
VENDOR="Pizzaria Foundation"
VERSION=0,1,0

# Its own UID in the unprotected 0xE development block, next to imgprobe (…70) and
# audioprobe (…71), so all three install alongside each other rather than over one another.
UID3=0xE1234572

# WriteUserData so the report can land in C:\Data\, the one place on this handset that is
# both writable and reachable over Bluetooth. The database itself needs no capability: it
# lives in the app's private directory and is a non-secure database, which is an ordinary
# file as far as the file server is concerned.
CAPABILITIES="WriteUserData"

USE_SHIM=1
# The whole point of this binary, and the reason it is a binary at all: the sqldb.dll import
# lands here and nowhere else. A static import of a DLL the handset does not have stops the
# loader with no error, no log and no report file — so the question "does this phone have
# SQLite" can only be asked from a package that has nothing else to lose.
USE_SQL=1
# Nothing else. A probe that asks one question should not be able to fail for a second
# reason.
USE_IMAGE=0
USE_AUDIO=0
USE_NET=0

RUST_CRATE=device

HEAP=0x1000,0x400000
STACK=0x8000

# The dev handset runs a patched installserver; see tools/symbuild.
SIGN=0
