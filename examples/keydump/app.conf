# A diagnostic app: reads the handset's own ABNT2 QWERTY keymap out of ptiengine.dll.
#
# Exists because the SDK was treating a Brazilian E72 as a US QWERTY — no accents, no
# Chr/Fn symbol layer, no `+`. The keymap that fixes that has to be measured, not
# deduced; this measures it once and tools/mkkeymap.py bakes the answer into
# crates/symbian-keys. See src/keydump.cpp.

NAME=keydump
VENDOR="RustSdkDev"
VERSION=0,1,0

# Its own UID so it installs alongside the chat and the other probes rather than
# replacing one of them.
UID3=0xE123456C

# WriteUserData so the dump can land in C:\Data\, the same reason examples/imgprobe declares
# it: C:\private\<UID3>\ needs no capability at all, but it is invisible to File Manager and
# to USB, which makes it useless for a file whose entire purpose is to be carried off the
# device. And this probe has no epocadb bridge to pull it through — it deliberately imports no
# socket libraries, because a probe that asks the keymap engine one question should not also
# be able to fail at networking.
#
# Quoted: unquoted, a second capability's space would end the assignment and the shell would
# try to run the second word.
CAPABILITIES="WriteUserData"

USE_SHIM=1

# The whole point of this binary, and the reason it is a separate one. ptiengine.dll is
# the platform's keymap database (not the FEP — that is a different thing this SDK
# deliberately does not use). An import the handset cannot satisfy stops the image
# loading with no error, no log and no report file, so this import lives here and in
# nothing that ships. Run examples/libprobe first: it asks whether the DLL is there.
EXTRA_LIBS="ptiengine"

# Has to be C++ because CPtiEngine is a Symbian class and the shim ABI deliberately
# exposes no keymap surface — there is nothing to expose once the table is baked.
CXX_SOURCES="src/keydump.cpp"
RUST_CRATE=device

HEAP=0x1000,0x400000
STACK=0x8000

# The dev handset runs a patched installserver; see tools/symbuild.
SIGN=0
