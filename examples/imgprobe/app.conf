# Build manifest, read by tools/symbuild.

NAME=imgprobe
VENDOR="Pizzaria Foundation"
VERSION=0,1,0

# Its own UID, in the unprotected 0xE development block, so it installs *alongside* the
# Telegram client rather than over it. UID3 is the identity both the installer and the data
# cage key on, and a collision silently replaces the other app.
UID3=0xE1234570

# WriteUserData so the report can land in C:\Data\, which is the one place on this handset
# that is both writable and reachable — the app's own private directory needs no capability
# and is invisible to File Manager and to USB, which makes it useless for a report whose
# entire purpose is to be carried off the device.
#
# Quoted and +-joined: unquoted, the shell reads the space as the end of the assignment and
# runs the second word as a command.
CAPABILITIES="WriteUserData"

USE_SHIM=1
# The whole point of this binary. It also means the imageconversion.dll import lands here
# and not in something that has other work to do — see the "keep diagnostics off the
# critical path" note in docs/device-notes.md.
USE_IMAGE=1
# No network: this probe asks the codec a question, and a socket would be one more thing
# that can fail before the report is written.
USE_NET=0

# The probe's own C++, alongside the shared shim. It has to be C++ because the matrix
# varies things the shim ABI deliberately does not expose — decoder options, a forced
# plugin UID, the destination's display mode.
CXX_SOURCES="src/imgprobe.cpp"
RUST_CRATE=device

HEAP=0x1000,0x400000
STACK=0x8000

# The dev handset runs a patched installserver; see tools/symbuild.
SIGN=0
