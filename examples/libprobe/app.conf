# A diagnostic app: which optional DLLs this handset actually has.
#
# The SDK links against a device ROM we cannot inspect. Open C — libc, libcrypto,
# libssl, libz — shipped as a separate package on S60 3rd Edition, so its presence is
# a property of the handset, not of the SDK. Whether it is there decides how storage,
# crypto and TCP get built, so it is worth one build to find out rather than
# discovering it as an app that refuses to launch.

NAME=libprobe
VENDOR="Pizzaria Foundation"
VERSION=0,1,0

# Its own UID so it installs alongside the chat rather than replacing it.
UID3=0xE123456B

CAPABILITIES=none
USE_SHIM=1
CXX_SOURCES=""
RUST_CRATE=device

HEAP=0x1000,0x200000
STACK=0x8000
SIGN=0
