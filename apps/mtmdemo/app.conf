# mtmdemo — a Client MTM the Message Server can actually load.
#
#   tools/epoc build apps/mtmdemo      -> apps/mtmdemo/build/mtmdemo.dll
#
# Produces no .sis of its own: the DLL and its registration resource are bundled into the
# package of whatever installs them, through EXTRA_DLLS and EXTRA_MTM_RESOURCES.

NAME=mtmdemo
VENDOR="RustSdkDev"
VERSION=0,1,0
UID3=0xE0DD0B01

TARGETTYPE=DLL

# UID2 is the polymorphic interface this DLL implements — for a Client MTM,
# KUidMtmClientComponentVal from msvstd.hrh. The reference implementation's own .mmp does the
# same (`txtc.mmp: UID 0x10003C5F 0x10003C3F`), and the Message Server asserts on it when it
# adds the DLL to a registry.
UID2=0x10003C5F

# Four exports, one per MTM component slot. Not because four components are wanted — only
# the client is real — but because CObserverRegistry indexes the declared component array by
# fixed slot with no bounds check, so a registration that declares fewer is a panic. See the
# header comment in src/mtmclient.cpp.
#
# The ordinals these land on are NOT this order: elf2e32 sorts export names. That is why the
# registration below is generated from the .def rather than written by hand.
EXPORTS="NewMtmClientL NewMtmServerL NewMtmUiL NewMtmUiDataL"

USE_SHIM=0
# One file. Everything else comes from shim/mtm via USE_MTM.
CXX_SOURCES="src/mtmdemo.cpp"
USE_MTM=1
# Breadcrumbs from inside Nokia's process, to C:\Data\dump-mtmdemo.txt. On for the
# reference app because it is the thing being measured; off for a shipped service.
MTM_TRACE=1

# msgs carries CBaseMtm and the message store; etext carries CRichText, which is what a
# message body is. Both proven present on this handset by the device sweep.
# mtur carries CBaseMtmUiData; fbscli and bitgdi the CFbsBitmap the icon array is made of;
# cone because CBaseMtmUiData holds a CCoeEnv and its ConstructL reaches for one.
# avkon and eikcore join for the viewer's CAknMessageQueryDialog. Both are already loaded in
# the process this DLL runs in — it is the Messaging application — so they cost nothing to
# reach, but they are imports all the same and are named here deliberately.
SYMBIAN_LIBS="euser efsrv estor msgs mtur etext fbscli bitgdi cone eikcore avkon"

# The registration resource, GENERATED from the .def the linker produced and then compiled
# and installed to \resource\messaging\mtm\.
#
# Generated rather than written because the ordinal each export lands on comes out of
# elf2e32's name sort, and a hand-written entry_point that disagrees sends the framework to
# the wrong function with the wrong signature. The template names the C symbol for each
# component slot; symbuild substitutes the ordinal the linker actually assigned.
# The shared template — every per-service value in it is a substituted variable.
MTM_RESOURCE_TEMPLATE="$SDK/shim/mtm/data/mtmreg.rss.in"

# The UI-data component's own two runtime files. CBaseMtmUiData opens the resource during
# construction and loads the icon array from the .mbm, both inside whichever application is
# drawing a message list — so a missing file is a Leave in Nokia's process, not a build error.
#
# The order of MTM_ICONS is the order of TMtmDemoIcon in src/mtmuidata.cpp: CreateBitmapsL
# walks the .mbm from first to last.
MTM_UI_RESOURCE=data/mtmdemo.rss
MTM_ICONS="mtmdemo_msg.bmp mtmdemo_svc.bmp"
MTM_TYPE_UID=0xE0DD0B01
MTM_TECHNOLOGY_UID=0xE0DD0B02
MTM_NAME="MTM demo"
MTM_SERVER_EXPORT=NewMtmServerL
MTM_CLIENT_EXPORT=NewMtmClientL
MTM_UI_EXPORT=NewMtmUiL
MTM_UIDATA_EXPORT=NewMtmUiDataL

# ALL minus TCB, which is what the SDK's reference MTM asks for (`txtc.mmp: CAPABILITY All
# -TCB`) and what the platform-security guide prescribes for client, UI and UI-data MTMs.
#
# The rule is the opposite of what this file used to claim. It said a DLL inherits the
# capabilities of the process that loads it and its own set merely restricts who may load it,
# so asking for nothing was the permissive choice. It is the other way round: **a DLL must
# hold at least the capabilities of the process loading it**, or the loader refuses it. With
# `none`, no privileged process could load this at all — and the symptom on the handset was
# the Messaging application answering "Unable to execute file for security reasons" when it
# went to instantiate our MTM.
#
# TCB is excluded because nothing here writes to the trusted computing base, and a DLL asking
# for it would be refused by any sane installer. Every other capability is granted on this
# handset — measured, not assumed, by apps/devdump's caps probe.
CAPABILITIES="CommDD+PowerMgmt+MultimediaDD+ReadDeviceData+WriteDeviceData+DRM+TrustedUI+ProtServ+DiskAdmin+NetworkControl+AllFiles+SwEvent+NetworkServices+LocalServices+ReadUserData+WriteUserData+Location+SurroundingsDD+UserEnvironment"
SIGN=0
