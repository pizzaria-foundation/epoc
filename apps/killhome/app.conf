# killhome — the escape hatch for the resident launcher.
#
#   tools/epoc build apps/killhome
#
# The resident launcher (apps/launcher) captures the Menu key and does not close on End, so it
# cannot be stopped from its own UI. This is the way out: an ordinary app that, when opened, kills
# the launcher process by UID. It is reachable from the launcher's own grid, and — because the
# launcher does not auto-start (the startup item needs a trusted package) — a reboot also clears a
# misbehaving launcher, so this is the convenience, not the only rescue.

NAME=killhome
VENDOR="Pizzaria Foundation"
VERSION=0,1,0
UID3=0xE0AA0001

USE_SHIM=1
RUST_CRATE=device

# Stop the launcher through the window server: USE_APPARC brings in shim_app_kill
# (TApaTask::KillTask — the way one app ends another). USE_PROC is only for is_running, to report
# before/after — no RProcess::Kill, because that faults the caller without PowerMgmt.
USE_APPARC=1
USE_PROC=1

# No capability declared. PowerMgmt (which RProcess::Kill would need) is NOT signable by the dev
# cert — declaring it made the whole package fail to install with a certificate error. The
# window-server kill path does not need it declared; if it needs it at runtime, the ROM patch
# grants it. So: install clean, and let the handset's runtime grant decide.
CAPABILITIES=none
HEAP=0x1000,0x200000
SIGN=0

# Log the kill attempt to C:\Data\_logs\killhome.txt — no network needed, survives a crash. The
# on-screen status is the fast read; the file is the record if the kill faults this app.
DEBUG=1
