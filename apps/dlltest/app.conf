# dlltest — a minimal Symbian polymorphic DLL, built to prove the toolchain can.
#
#   tools/epoc build apps/dlltest      -> apps/dlltest/build/dlltest.dll
#
# It produces no .sis of its own. Whoever loads it bundles it, through that app's
# EXTRA_DLLS — see apps/devdump/app.conf.

NAME=dlltest
VENDOR="RustSdkDev"
VERSION=0,1,0
UID3=0xE07D11E5

# The whole point. See tools/symbuild's TARGETTYPE block for what changes.
TARGETTYPE=DLL

# The export set, in the order the ordinals should come out. symbuild turns this
# into a linker version script, so these names are the ABI: everything else in the
# image is localised and cannot be exported by accident.
#
# ONE name on purpose. elf2e32 numbers exports by sorting the .dynsym names
# (vendor/gnupoc-git/tools/elf2e32/elf2e32.cpp:156), not by the order given here —
# so with two or more exports the ordinals are alphabetical by mangled name, and
# adding a third can renumber the other two under callers that have already
# hardcoded them. With one export the sort is a no-op and ordinal 1 is guaranteed.
# A DLL that genuinely needs several exports should freeze them with a .def file
# (elf2e32 --definput) instead of relying on the sort.
EXPORTS="SymbianDllTestEntry"

# No shim, no Rust, no GUI. A DLL that used the shim would drag the whole Avkon
# import set into an image whose only job is to be loadable — and every import is
# another way for the loader to refuse it, which is exactly the failure this test
# is trying to distinguish from its own bugs.
USE_SHIM=0
CXX_SOURCES="src/dlltest.cpp"
SYMBIAN_LIBS="euser"

# The handset is ROM-patched, so this is not a ceiling. It is set to none because a
# DLL inherits the capabilities of the process that loads it and its own set only
# ever restricts which processes may load it; asking for nothing means anything can.
# Matching the probe that loads it, because "a DLL needs at least the loading process's
# capabilities" would otherwise be the reason it fails, and that is not the question being asked.
# The question is whether a DLL COPIED into C:\sys\bin (rather than installed from a SIS) can be
# loaded at all on this handset — our own EXEs are copied there and run, and whether that carries
# over to DLLs decides what to do about the TLS pair.
CAPABILITIES=none
SIGN=0
