# Build manifest, read by tools/symbuild.

NAME=tileprobe
VENDOR="Pizzaria Foundation"
VERSION=0,1,0

# 0xE is the unprotected development block. This one value becomes three things that must
# agree: the E32 header UID3, the UID3 in the registration resource, and KUidShimApp in the
# shim (via -DSHIM_APP_UID3). symbuild wires all three. Headless, so there is no
# registration resource — see HEADLESS below.
UID3=0xE0DD00F9

# NetworkServices to open a socket; the two data capabilities for the report file. All three
# are unprotected, so this still installs on a stock phone — unlike apps/gpsprobe, which
# needs Location and does not.
CAPABILITIES="NetworkServices ReadDeviceData WriteDeviceData"

# The two risky imports this binary exists to exercise together, and the reason it is not
# folded into httpprobe:
#
#   USE_HTTP    RHTTPSession, already proven by apps/httpprobe. Implies USE_NET.
#   USE_IMAGE   imageconversion.dso — CImageDecoder. NOTHING IN THIS REPO HAS EVER LINKED
#               IT: crates/symbian/src/image.rs and shim/src/shim_image.cpp are written and
#               have never run on a handset. This probe is the first execution of that code.
#
# One risky import set per binary is the rule, and this is the exception that proves it: the
# question here is not "does either work" but "does a fetched tile decode", which is one
# measurement across both. httpprobe already isolated the HTTP half, so a failure that is
# only in the decoder is still distinguishable — by that probe having passed.
USE_HTTP=1
USE_IMAGE=1

# Headless. No window group, so a run cannot collide with a previous instance of the same
# UID3 — the silent-exit failure httpprobe's crate docs describe.
USE_SHIM_DAEMON=1
HEADLESS=1

CXX_SOURCES=""
RUST_CRATE=device

# Named by hand, because the block in symbuild that collects the base set and every USE_*
# library gate runs only for USE_SHIM — a headless daemon gets none of it, which symbuild
# already documents for USE_SQL. So:
#
#   euser efsrv estor hal                      the base
#   esock insock commdb netmeta                shim_net's bearer and sockets
#   http inetprotutil bafl                     the HTTP stack, TUriParser8, the string pool
#   apgrfx cone ws32                           shim_net references TApaTask and CCoeEnv
#   imageconversion fbscli bitgdi gdi          CImageDecoder and the CFbsBitmap it decodes
#                                              into — the bitmap needs the font and bitmap
#                                              server client, which a GUI app gets from the
#                                              base set and a daemon does not
SYMBIAN_LIBS="euser efsrv estor hal esock insock commdb netmeta http inetprotutil bafl apgrfx cone ws32 imageconversion fbscli bitgdi gdi"

# 4 MB. A 256x256 tile is 128 KB of RGB565 in our heap plus the same again in the font and
# bitmap server's, and four tiles are fetched in sequence — the compressed body, the copied
# pixels and the shim's buffers are alive together for one of them at a time.
HEAP=0x1000,0x400000
STACK=0x8000

# Debug logging. 1 makes every `symbian::log!("…")` in this app append to
# C:\Data\logs_tileprobe.txt — no capability, no host, readable off the phone afterwards.
DEBUG=1

# The dev handset runs a patched installserver; see tools/symbuild.
SIGN=0
