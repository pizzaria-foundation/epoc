# Build manifest, read by tools/symbuild.

NAME=gpsprobe
VENDOR="Pizzaria Foundation"
VERSION=0,1,0

# 0xE is the unprotected development block. This one value becomes three things that must
# agree: the E32 header UID3, the UID3 in the registration resource, and KUidShimApp in the
# shim (via -DSHIM_APP_UID3). symbuild wires all three. Headless, so there is no
# registration resource — see HEADLESS below.
UID3=0xE0DD00F8

# Location is PROTECTED, and this is the first binary in the repo to declare one.
#
# It installs here because the handset is ROM-patched and grants all twenty capabilities —
# measured, not assumed: apps/devdump's caps probe found HasCapability and the privileged
# operations agreeing on every one. On a stock phone an unsigned package declaring Location
# would not install at all, and that is a property of the phone rather than of this code.
#
# The two data capabilities are for the report file, as in every other probe here.
CAPABILITIES="Location ReadDeviceData WriteDeviceData"

# The Location Acquisition API: RPositionServer and RPositioner. This is the reason this
# binary exists and the reason it is alone — lbs.dso is an import nothing in this repo has
# linked before, and an import that does not resolve makes the application vanish with no
# panic, no log and no report. One risky import set per binary means a failure here reads
# "lbs is not importable" and cannot read as anything else.
USE_LBS=1

# Headless. No window group, so a run cannot collide with a previous instance of the same
# UID3 — the failure httpprobe's crate docs describe, where a launch after a mid-list death
# exits immediately and silently. A probe that waits minutes for a cold GPS fix is exactly
# the kind that gets killed halfway.
USE_SHIM_DAEMON=1
HEADLESS=1

CXX_SOURCES=""
RUST_CRATE=device

# Named by hand, because the block in symbuild that collects the base set and every USE_*
# library gate runs only for USE_SHIM — a headless daemon gets none of it, which symbuild
# already documents for USE_SQL. So:
#
#   euser efsrv estor hal   the base: descriptors, files, HAL for shim_time
#   lbs                     RPositionServer, RPositioner, TPositionInfo, TPositionQuality
SYMBIAN_LIBS="euser efsrv estor hal lbs"

# 1 MB. This probe holds an inventory of a handful of modules and one position report; the
# heap is sized for the shim's own buffers rather than for anything this code allocates.
HEAP=0x1000,0x100000
STACK=0x8000

# Debug logging. 1 makes every `symbian::log!("…")` in this app append to
# C:\Data\logs_gpsprobe.txt — no capability, no host, readable off the phone afterwards.
# Worth having on here: a probe that waits minutes for a fix should say what it is waiting
# for, or a run that is working is indistinguishable from one that is stuck.
DEBUG=1

# The dev handset runs a patched installserver; see tools/symbuild.
SIGN=0
