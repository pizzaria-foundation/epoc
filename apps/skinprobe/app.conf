# Build manifest, read by tools/symbuild.

NAME=skinprobe
VENDOR="RustSdkDev"
VERSION=0,1,0

# 0xE is the unprotected development block. This one value becomes three things that must
# agree: the E32 header UID3, the UID3 in data/skinprobe_reg.rss, and KUidShimApp in the
# shim (via -DSHIM_APP_UID3). symbuild wires all three.
UID3=0xE2684259

# Declare only what the binary uses. A capability an app does not need is a capability the
# user is asked to trust for no reason — and an unsigned package declaring a protected one
# will not install on a stock phone at all.
CAPABILITIES=none

USE_SHIM=1

# The whole point of this probe, and the one line that carries the risk.
#
# aknskins is AknsUtils -- the phone's own theme colour table. It is NOT in the base library set, and
# on Symbian an import that does not resolve does not fail the build or report an error: the image
# silently never loads. So the question "does this link and run on the E72?" can only be answered by
# a binary that can be thrown away, which is this one. Nothing resident gets USE_SKIN=1 until this has
# answered.
USE_SKIN=1
CXX_SOURCES=""
RUST_CRATE=device

HEAP=0x1000,0x200000
STACK=0x8000

# Debug logging. 1 makes every `symbian::log!("…")` in this app append to
# C:\Data\logs_skinprobe.txt — no capability, no host, readable off the phone afterwards. 0 removes
# those call sites entirely, format strings included, so leaving them in the source costs a
# release build nothing. Write the lines as you go; flip this when you need them.
DEBUG=1

# The dev handset runs a patched installserver; see tools/symbuild.
SIGN=0
