# Build manifest, read by tools/symbuild.

NAME=domprobe
VENDOR="RustSdkDev"
VERSION=0,1,0

# 0xE is the unprotected development block. This one value becomes three things that must
# agree: the E32 header UID3, the UID3 in data/domprobe_reg.rss, and KUidShimApp in the
# shim (via -DSHIM_APP_UID3). symbuild wires all three.
UID3=0xE0DD00F8

# Declare only what the binary uses. A capability an app does not need is a capability the
# user is asked to trust for no reason — and an unsigned package declaring a protected one
# will not install on a stock phone at all.
CAPABILITIES="ReadDeviceData WriteDeviceData"

# Headless: no window group, so a push can replace it while nobody is holding it open.
USE_SHIM_DAEMON=1
HEADLESS=1
USE_NETSURF=1
USE_MEM=1

# Named by hand, because the block that collects the base set only runs for USE_SHIM.
# The worker phase needs shim_work.cpp, which symbuild gates on USE_NET. It also drags the socket
# libraries in, which this probe never opens — the honest cost of the worker living behind that flag.
USE_NET=1
SYMBIAN_LIBS="euser efsrv estor hal esock insock commdb netmeta apgrfx cone ws32"
CXX_SOURCES=""
RUST_CRATE=device

HEAP=0x1000,0x800000
STACK=0x8000

# Debug logging. 1 makes every `symbian::log!("…")` in this app append to
# C:\Data\logs_domprobe.txt — no capability, no host, readable off the phone afterwards. 0 removes
# those call sites entirely, format strings included, so leaving them in the source costs a
# release build nothing. Write the lines as you go; flip this when you need them.
DEBUG=1

# The dev handset runs a patched installserver; see tools/symbuild.
SIGN=0
