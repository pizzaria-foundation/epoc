# Build manifest, read by tools/symbuild.

NAME=iconprobe
VENDOR="RustSdkDev"
VERSION=0,1,0

# 0xE is the unprotected development block. This one value becomes three things that must
# agree: the E32 header UID3, the UID3 in data/iconprobe_reg.rss, and KUidShimApp in the
# shim (via -DSHIM_APP_UID3). symbuild wires all three.
UID3=0xEC4C5532

# Declare only what the binary uses. A capability an app does not need is a capability the
# user is asked to trust for no reason — and an unsigned package declaring a protected one
# will not install on a stock phone at all.
CAPABILITIES=none

USE_SHIM=1
CXX_SOURCES=""
RUST_CRATE=device

# The whole point of this probe: exercise the app-icon path in isolation. USE_APPARC brings in
# RApaLsSession (list apps), USE_APPICON compiles the GetAppIcon/CApaMaskedBitmap/GetScanLine path
# in shim_apparc.cpp. This is a normal, non-resident app: if a fetch panics, it just closes and you
# reopen — it can never trap the home the way testing in the resident launcher did.
USE_APPARC=1
USE_APPICON=1

# USE_AKNICON adds method C: the icon read from the app's registered icon FILE through Avkon's
# AknIconUtils. It is a separate gate because it links a library nothing else needs (aknicon), and
# an import that does not resolve makes the image vanish silently rather than fail loudly. That risk
# belongs here, in a probe that can be reopened, and not in the resident launcher — so this stays
# the only app with the gate on until the device says the link is good.
USE_AKNICON=1

HEAP=0x1000,0x200000
STACK=0x8000

# Debug logging. 1 makes every `symbian::log!("…")` in this app append to
# C:\Data\_logs\iconprobe.txt — no capability, no host, readable off the phone afterwards. 0 removes
# those call sites entirely, format strings included, so leaving them in the source costs a
# release build nothing. Write the lines as you go; flip this when you need them.
DEBUG=1

# The dev handset runs a patched installserver; see tools/symbuild.
SIGN=0
