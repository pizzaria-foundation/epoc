# Build manifest, read by tools/symbuild.

NAME=cenrepdump
VENDOR="RustSdkDev"
VERSION=0,1,0

# 0xE is the unprotected development block. This one value becomes three things that must
# agree: the E32 header UID3, the UID3 in data/cenrepdump_reg.rss, and KUidShimApp in the
# shim (via -DSHIM_APP_UID3). symbuild wires all three.
UID3=0xE0AA0020

# Declare only what the binary uses. A capability an app does not need is a capability the
# user is asked to trust for no reason — and an unsigned package declaring a protected one
# will not install on a stock phone at all.
# AllFiles, and it is the entire reason this is a separate throwaway application. Both repository
# directories are another process's private cage (SID 10202be9), and nothing reads them without it.
# A protected capability has broken an install in this repo before, so it lives here where the cost
# of that is one probe rather than the home screen.
CAPABILITIES="AllFiles WriteDeviceData"

USE_SHIM=1
# Central Repository, for the one setting this exists to find and change: which application the
# phone treats as its idle screen. Gated because it adds centralrepository.dso, and a library an
# app does not need stays out of it.
USE_CENREP=1
# The application registry, to dump every installed app's UID against its caption. That table is
# what turns "which UID is the Active Idle application" from a guess into a lookup — and the UID is
# what a ROM patch would have to find inside SysAp.exe.
USE_APPARC=1
CXX_SOURCES=""
RUST_CRATE=device

HEAP=0x1000,0x200000
STACK=0x8000

# Debug logging. 1 makes every `symbian::log!("…")` in this app append to
# C:\Data\logs_cenrepdump.txt — no capability, no host, readable off the phone afterwards. 0 removes
# those call sites entirely, format strings included, so leaving them in the source costs a
# release build nothing. Write the lines as you go; flip this when you need them.
DEBUG=1

# The dev handset runs a patched installserver; see tools/symbuild.
SIGN=0
