# Build manifest, read by tools/symbuild.

NAME=httpprobe
VENDOR="RustSdkDev"
VERSION=0,1,0

# 0xE is the unprotected development block. This one value becomes three things that must
# agree: the E32 header UID3, the UID3 in data/httpprobe_reg.rss, and KUidShimApp in the
# shim (via -DSHIM_APP_UID3). symbuild wires all three.
UID3=0xE0DD00F6

# Declare only what the binary uses. A capability an app does not need is a capability the
# user is asked to trust for no reason — and an unsigned package declaring a protected one
# will not install on a stock phone at all.
# NetworkServices to open a socket at all; the two data capabilities are for the report file. All
# three are in the unprotected set, so this still installs on a stock phone.
CAPABILITIES="NetworkServices ReadDeviceData WriteDeviceData"

# The headless entry, NOT USE_SHIM. The two are mutually exclusive: USE_SHIM takes shim_app.cpp
# (Avkon, framebuffer, E32Main), USE_SHIM_DAEMON takes shim_daemon.cpp, and setting both links the
# GUI entry against a framebuffer that was excluded — a wall of undefined CShimSurface references.
CXX_SOURCES=""
RUST_CRATE=device

# The platform HTTP stack: RHTTPSession, asynchronous, safe from the GUI pump. This is what the
# probe exists to test, and it is the reason this binary is on its own — it adds http.dso and
# inetprotutil.dso, which nothing in this repo has imported before, and an import that fails to
# resolve makes an application vanish with no panic and no log. One risky import set per binary.
#
# USE_HTTP implies USE_NET in symbuild: the session is bound to the bearer shim_net.cpp brings up.
USE_HTTP=1

# Headless. No window group, so a run cannot collide with a previous instance of the same UID3 —
# which cost one run: the launch after a mid-list death exited immediately and silently. Also drops
# the GUI entry's font atlases, which this has no use for.
USE_SHIM_DAEMON=1
HEADLESS=1

# Named by hand, because the block in symbuild that collects the base set and every USE_* library
# gate runs only for USE_SHIM — a headless daemon gets none of it, which symbuild already documents
# for USE_SQL. So the imports this binary needs are listed here:
#
#   euser efsrv estor hal            the base: descriptors, files, HAL for shim_time
#   esock insock commdb netmeta      shim_net's bearer and sockets
#   http inetprotutil bafl           the HTTP stack, TUriParser8, and the string pool
#   apgrfx cone ws32                 shim_net references TApaTask and CCoeEnv to move an app out of
#                                    the way of the access-point dialog. Dead code in a daemon (the
#                                    null check catches it) but the linker still resolves symbols.
SYMBIAN_LIBS="euser efsrv estor hal esock insock commdb netmeta http inetprotutil bafl apgrfx cone ws32"

# 4 MB. The probe drains and drops every body, so the heap is sized for the shim's own buffers and
# the row list rather than for a page — the biggest target in the list must not be what decides
# this number.
HEAP=0x1000,0x400000
STACK=0x8000

# Debug logging. 1 makes every `symbian::log!("…")` in this app append to
# C:\Data\logs_httpprobe.txt — no capability, no host, readable off the phone afterwards. 0 removes
# those call sites entirely, format strings included, so leaving them in the source costs a
# release build nothing. Write the lines as you go; flip this when you need them.
DEBUG=1

# The dev handset runs a patched installserver; see tools/symbuild.
SIGN=0
