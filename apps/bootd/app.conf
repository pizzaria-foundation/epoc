# bootd — the boot supervisor.
#
# The ONE executable registered in the platform's start-up list, and the only reason that list is
# enough: S60's STARTUP_ITEM_INFO has no ordering field and exactly one recovery policy
# ("do nothing" — sdk/epoc32/include/startupitem.hrh), so order and restart behaviour have to be
# somebody's own code. This is that code. It reads C:\Data\bootd\boot.cfg, launches the listed apps
# in order, watches them, and restarts them by policy.
#
# It ships inside bootctl's signed package (EXTRA_EXES) and has no .sis anyone installs directly.

NAME=bootd
VENDOR="RustSdkDev"
VERSION=0,1,0
UID3=0xE0AA0011

USE_SHIM_DAEMON=1
HEADLESS=1
RUST_CRATE=device

# Launch by UID through RApaLsSession: shim_app_launch needs no CCoeEnv, so it works headless.
USE_APPARC=1
# Detect death with TFindProcess (process::is_running). NOT apps::running() — that one goes through
# CCoeEnv::Static(), which a daemon does not have, so it would answer NotReady forever.
USE_PROC=1

# Headless: SYMBIAN_LIBS is only defaulted for the GUI build, so name them. apparc/apgrfx are
# RApaLsSession and CApaCommandLine.
#
# Note what is NOT here: cone and ws32. The task-list half of shim_apparc.cpp (shim_app_kill /
# shim_apps_running) references CCoeEnv and RWsSession, but this daemon can never reach that code —
# there is no CCoeEnv in a USE_SHIM_DAEMON build — and --gc-sections drops it before the linker's
# undefined check. Verified, not assumed: e32dump.py on the built image lists 7 DLLs and neither
# cone nor ws32 is among them. Keeping a window-server import out of a headless boot process is
# worth the check; an unresolved ordinal makes an image fail to load in silence.
SYMBIAN_LIBS="euser apparc apgrfx efsrv estor hal"

# Launching needs no capability, and C:\Data is outside \sys, \resource and \private, so writing
# the config and status files needs none either.
CAPABILITIES=none

# Signed as part of bootctl's package, not on its own.
SIGN=0
AUTOSTART=0

# C:\Data\logs_bootd.txt — the only window into a headless process that runs at boot. Worth its
# cost: "did it launch, what rc, how long after start" is exactly the unknown here.
DEBUG=1
