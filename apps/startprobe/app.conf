# startprobe — sample the platform's startup / system-state properties during a real boot.
#
# The question it exists for: our launcher is born very early in the boot (its own log shows it
# already racing for the foreground with the phone at 38 s of uptime), and every boot behaviour it
# has is a clock heuristic approximating a state the platform publishes. We can read that state
# from the host over Bluetooth — but the phone's Bluetooth stack only answers from ~67 s of uptime
# onward, and by then everything interesting has happened. This runs ON the phone, from as early as
# the start-up list will launch it, and writes what it sees to a file we read afterwards.
#
# Isolated on purpose (see docs/device-notes.md): its own binary, so a probe that misbehaves during
# a boot costs one throwaway daemon and never the home screen.

NAME=startprobe
VENDOR="Pizzaria Foundation"
VERSION=0,1,0

# 0xE is the unprotected development block. Not shared with any app in this repo.
UID3=0xEC4C5540

USE_SHIM_DAEMON=1
HEADLESS=1
RUST_CRATE=device

# Publish & Subscribe is the whole probe. Nothing else is linked, which is also why this needs no
# capability at all: reading these properties is an ordinary read on this handset.
USE_PROP=1
SYMBIAN_LIBS="euser efsrv estor hal"
CAPABILITIES=none
SIGN=0

HEAP=0x1000,0x100000
STACK=0x4000

# The entire output of this probe is its log. Without this it does nothing observable.
DEBUG=1

# Register a platform start-up item, so the phone itself launches this at boot — which is the only
# way to be running during the window the remote shell cannot reach. symbuild compiles the shared
# template into build/startprobe_startup.rsc and packages it to
# !:\private\101f875a\import\[EC4C5540].rsc. On this handset the installer does not actually
# place that file (the reason bootd repairs its own), so it gets pushed by hand over the remote
# shell — which also makes removal one `rm` rather than an uninstall.
AUTOSTART=1
