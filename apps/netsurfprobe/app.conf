# netsurfprobe — the F5 link test for the NetSurf MIT libraries.
#
# It exists to answer R1 of docs/plan-browser.md (does the C runtime these libraries
# need exist on this handset) and nothing else, so it is the smallest binary that can
# carry all five archives: no shim, no Rust, no Avkon, no window group.
#
# See the header of src/netsurfprobe.cpp for why each of those absences is deliberate.

NAME=netsurfprobe
VENDOR="Pizzaria Foundation"
VERSION=0,1,0

# 0xE is the unprotected development block.
UID3=0xE0DD00FA

# Writes C:\Data\netsurfprobe.txt and nothing else. No network — the probe parses a
# string literal, deliberately, so a network failure cannot be mistaken for a parse
# failure. Both data capabilities are in the unprotected set.
CAPABILITIES="ReadDeviceData WriteDeviceData"

# The whole point of this app.conf: build the five vendored NetSurf libraries and link
# them. symbuild calls tools/build-netsurf and adds `libc` to the imports.
USE_NETSURF=1

# No shim of either shape. This binary owns its own E32Main, which is why it needs no
# Rust crate either — the shim is what usually provides the entry point, and the
# fourteen imports it brings would each be a new way for the loader to refuse an image
# whose only job is to prove it loads.
USE_SHIM=0
CXX_SOURCES="src/netsurfprobe.cpp"

# Separate from CXX_SOURCES, and it has to be: the NetSurf headers are C99 and not
# C++-safe (libdom names a parameter `namespace`, libcss declares `*restrict`). This is
# the only file in the repository that includes them. See inc/netsurf_probe.h.
C_SOURCES="src/netsurf_probe.c"
RUST_CRATE=

# Three imports, and that count is the measurement this file is here to make:
#
#   euser   descriptors, CTrapCleanup, the heap
#   efsrv   RFs and RFile, for the report
#   libc    Open C. The 24 runtime symbols the five archives reference and libgcc does not
#           supply — malloc, memcpy, strncasecmp, snprintf, iconv and the rest. libc.dll
#           loads on this handset (docs/device-notes.md:799), which is what makes R1 a
#           non-event rather than a subsystem to write.
#
# libc is appended by symbuild's USE_NETSURF block rather than named here, so an app
# that opts in cannot forget it.
SYMBIAN_LIBS="euser efsrv"

# 4 MB. libcss's computed-style arena and libdom's node pool are the consumers, and one
# stylesheet plus a 45-byte document does not stress either — the number is here so a
# later, bigger fixture does not silently hit the default.
HEAP=0x1000,0x400000
STACK=0x8000

# No menu entry, no registration resource, no window group. See the httpprobe lesson in
# docs/plan-browser.md: a GUI app is one instance per UID3, and a run that dies leaving
# its window group behind makes the next launch exit with no log at all.
HEADLESS=1

# The dev handset runs a patched installserver; see tools/symbuild.
SIGN=0
