# Build manifest, read by tools/symbuild.

NAME=cpuprobe
VENDOR="RustSdkDev"
VERSION=0,1,0

# 0xE is the unprotected development block. This one value becomes three things that must
# agree: the E32 header UID3, the UID3 in data/cpuprobe_reg.rss, and KUidShimApp in the
# shim (via -DSHIM_APP_UID3). symbuild wires all three.
UID3=0xEC4C5533

# Declare only what the binary uses. A capability an app does not need is a capability the
# user is asked to trust for no reason — and an unsigned package declaring a protected one
# will not install on a stock phone at all.
CAPABILITIES=none

USE_SHIM=1
CXX_SOURCES=""
RUST_CRATE=device

# The whole point of this probe: ask whether this kernel accounts for thread CPU time, in a binary
# that can be thrown away. RThread::GetCpuTime links (it is exported from euser.dso) but on some
# Symbian 9.x builds the accounting is compiled out and the call answers KErrNotSupported -- and
# the SDK header says nothing either way. USE_CPUTIME compiles shim_cpu.cpp, which is the only
# place in this SDK that walks another process's threads. Nothing else opts in until this answers.
USE_CPUTIME=1


HEAP=0x1000,0x200000
STACK=0x8000

# Debug logging. 1 makes every `symbian::log!("…")` in this app append to
# C:\Data\_logs\cpuprobe.txt — no capability, no host, readable off the phone afterwards. 0 removes
# those call sites entirely, format strings included, so leaving them in the source costs a
# release build nothing. Write the lines as you go; flip this when you need them.
DEBUG=1

# The dev handset runs a patched installserver; see tools/symbuild.
SIGN=0
