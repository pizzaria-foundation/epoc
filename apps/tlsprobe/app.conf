# tlsprobe — does one real HTTPS GET and writes the result. The go/no-go for the whole TLS track.
#
#   tools/epoc build apps/tlsprobe  -> apps/tlsprobe/build/tlsprobe.sisx
#
# Headless one-shot. On its first timer tick it GETs https://www.google.com/ through the vendored
# mbedTLS port and writes the status line + head of the response to C:\Data\tlsprobe.txt. If that
# file shows an HTTP status, mbedTLS 3.4.1 handshakes TLS 1.2 with a modern server on the E72 —
# which is the one unknown the Google-Calendar (ICS-over-HTTPS) work rests on. Needs mbedtls.dll on
# the device (install mbedtls.sis from nnproject.cc/tls first).
NAME=tlsprobe
VENDOR="RustSdkDev"
VERSION=0,1,0
UID3=0xE0DD00F5
USE_SHIM_DAEMON=1
HEADLESS=1
RUST_CRATE=device
USE_TLS=1
SYMBIAN_LIBS="euser efsrv estor hal"
CAPABILITIES="NetworkServices ReadDeviceData WriteDeviceData"
HEAP=0x2000,0x800000
SIGN=1
