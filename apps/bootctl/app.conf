# bootctl — the boot manager's editor, and the package that ships the whole thing.
#
# Two binaries, one SIS: this GUI (an icon in the menu) plus bootd.exe, the headless supervisor,
# bundled through EXTRA_EXES. The start-up item registered at install time names BOOTD, not this
# app — see data/bootctl_startup.rss, which is hand-written for exactly that reason.
#
# Build apps/bootd FIRST: EXTRA_EXES fails hard if the executable is missing.

NAME=bootctl
VENDOR="RustSdkDev"
VERSION=0,1,0
UID3=0xE0AA0010

USE_SHIM=1
RUST_CRATE=device

# The installed-app roster, for the picker that adds an entry to the boot list.
USE_APPARC=1
# No app icons: the icon fetch panics on this handset (see apps/launcher/app.conf and
# docs/launcher.md). A caption list is all these rows need.
USE_APPICON=0

HEAP=0x1000,0x400000

# C:\Data\bootd\ is outside \sys, \resource and \private, so the config and status files need no
# capability. Declaring one we do not need is not free here — a protected capability has broken an
# install in this repo before (apps/killhome/app.conf).
CAPABILITIES=none

# AUTOSTART packages the start-up resource; SIGN=1 because the installer only honours a start-up
# item from a signed package. A "certificate error" on install means the handset clock is in the
# past, not that the signature is wrong.
AUTOSTART=1
SIGN=1

DEBUG=1

EXTRA_EXES="../bootd/build/bootd.exe"
