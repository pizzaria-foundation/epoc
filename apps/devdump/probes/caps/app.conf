# caps — one probe of apps/devdump. Headless: launched by the launcher, never from the menu.
#
# Built by tools/epoc build apps/devdump/probes/caps, and bundled into the launcher's
# package through its EXTRA_EXES. Produces no .sis of its own.
NAME=ddcaps
VENDOR="RustSdkDev"
VERSION=0,1,0
UID3=0xE0DD0030

# Headless daemon: no Avkon, no window group, no registration resource. It runs, writes its
# section and exits. HEADLESS=1 turns the missing _reg.rss from an error into the intent.
USE_SHIM=0
USE_SHIM_DAEMON=1
HEADLESS=1
RUST_CRATE=device

# Every library this image imports, named here and nowhere else. With USE_SHIM=0 there is
# no default set to inherit, which is the right way round for a probe: an import is the one
# thing that can stop this binary loading at all, so the list is a decision rather than a
# leftover.
SYMBIAN_LIBS="euser efsrv estor hal"
USE_CAPS=1
# Every capability there is. On a stock handset this would make the package uninstallable;
# on the patched one it is the experiment: what does the kernel actually grant?
CAPABILITIES="TCB+CommDD+PowerMgmt+MultimediaDD+ReadDeviceData+WriteDeviceData+DRM+TrustedUI+ProtServ+DiskAdmin+NetworkControl+AllFiles+SwEvent+NetworkServices+LocalServices+ReadUserData+WriteUserData+Location+SurroundingsDD+UserEnvironment"
SIGN=0
