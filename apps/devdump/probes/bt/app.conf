# bt — one probe of apps/devdump. Headless: launched by the launcher, never from the menu.
#
# Built by tools/epoc build apps/devdump/probes/bt, and bundled into the launcher's package
# through its EXTRA_EXES. Produces no .sis of its own.
NAME=ddbt
VENDOR="Pizzaria Foundation"
VERSION=0,1,0
UID3=0xE0DD0070

# Headless daemon: no Avkon, no window group, no registration resource. It runs, writes its
# section and exits. HEADLESS=1 turns the missing _reg.rss from an error into the intent.
#
# Headless is also what makes this probe's blocking inquiry legal at all: RHostResolver over
# KBTLinkManager takes on the order of ten seconds, and ten seconds inside a GUI app's rust_step
# starves the window server and freezes the whole phone. There is no window server here.
USE_SHIM=0
USE_SHIM_DAEMON=1
HEADLESS=1
RUST_CRATE=device

# Base libraries only. The six Bluetooth ones come from USE_BT in tools/symbuild rather than
# being named here, unlike probes/net — deliberately, because the BT set is going to be needed
# by an app next and a library list in two places is a library list that drifts. What USE_BT
# adds is btmanclient, btdevice, bluetooth, btextnotifiers, esock and centralrepository, and the
# comment on that flag says why every one of them is there.
SYMBIAN_LIBS="euser efsrv estor hal"
USE_BT=1
USE_PROP=1

# This is THE binary the whole probe exists to be. libsweep already loaded all six DLLs
# (docs/device-dump.txt:208-239) — that proves they open, not that a 2009 Nokia build exports
# the ordinals our import libraries name. An import that does not resolve stops the image
# loading with no error, no log and no report file, so the first line of dump-70-bt.txt is the
# finding: a BEGIN means the six resolved.
#
# LocalServices for the Bluetooth sockets an inquiry runs on; ReadDeviceData and WriteDeviceData
# for the registry and the power key. The handset is ROM-patched and grants all twenty
# (docs/device-notes.md:723-728), so this list is minimality rather than necessity.
CAPABILITIES=LocalServices+ReadDeviceData+WriteDeviceData
SIGN=0

# Trace the whole run: this probe's most likely failure is dying before it writes anything, and
# C:\Data\_logs\ddbt.txt is the only place a last breath would land.
DEBUG=1
