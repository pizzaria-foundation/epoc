# mtm — the only probe that writes.
#
# It registers a message type with the Message Server, creates a service and one message, and
# raises a notification. Everything else in the fleet only observes; this one changes the
# phone, so it runs last and it labels what it leaves behind.
NAME=ddmtm
VENDOR="Pizzaria Foundation"
VERSION=0,1,0
UID3=0xE0DD0061

USE_SHIM=0
USE_SHIM_DAEMON=1
HEADLESS=1
RUST_CRATE=device

# The messaging write side (msgs, mtur, etext for the CRichText body) and the notification
# (ecom). Named here and nowhere else: an import is the one thing that can stop this binary
# loading at all, so the list is a decision rather than a leftover.
#
# USE_CAPS is here for one line: the probe checks the registration file actually reached the
# device before blaming the Message Server for not finding it.
SYMBIAN_LIBS="euser efsrv estor hal"
USE_MSG=1
USE_NCN=1
USE_CAPS=1

# No MTM_RESOURCE of its own any more. The registration this probe installs belongs to
# apps/mtmdemo, whose DLL exports a real client factory — a registration the framework can
# actually act on, which a throwaway one pointing at a factoryless DLL never was.

# Writing into the user's message store. WriteDeviceData because the registration resource
# lands under \resource\, which is not the user's own area.
CAPABILITIES="ReadUserData+WriteUserData+ReadDeviceData+WriteDeviceData"
SIGN=0
