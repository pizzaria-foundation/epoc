# ncn — the platform's new-message notification, alone because it kills a process.
#
# An earlier run had this inside the mtm probe and the launcher recorded `mtm CRASHED` with
# this call's breadcrumb as the last line on disk. It is here, by itself, so that dying costs
# one section. See apps/devdump/src/probes/ncn.rs.
NAME=ddncn
VENDOR="Pizzaria Foundation"
VERSION=0,1,0
UID3=0xE0DD0062

USE_SHIM=0
USE_SHIM_DAEMON=1
HEADLESS=1
RUST_CRATE=device

# ecom for the ECom resolution, and msgs for the service entry it notifies about.
#
# It creates its own service rather than borrowing the mtm probe's, because the two run as
# separate processes and passing an id between them would mean a file, a parse and a second
# thing to go wrong — in the one binary that is already known to die.
SYMBIAN_LIBS="euser efsrv estor hal"
USE_MSG=1
USE_NCN=1

# The registration resource. symbuild compiles it and installs it to
# \resource\messaging\mtm\ — the directory the device dump found empty on C:.

# Writing into the user's message store. WriteDeviceData because the registration resource
# lands under \resource\, which is not the user's own area.
# Identical to the mtm probe's, deliberately. That probe makes the same session and service
# calls and survives them, and a capability difference between the two was one of only two
# explanations left for why this one does not. Matching them removes it as a variable for the
# price of a line.
CAPABILITIES="ReadUserData+WriteUserData+ReadDeviceData+WriteDeviceData"
SIGN=0
