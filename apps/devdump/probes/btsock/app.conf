# btsock — one probe of apps/devdump. Headless: launched by the launcher, never from the menu.
#
# Built by tools/epoc build apps/devdump/probes/btsock, and bundled into the launcher's
# package through its EXTRA_EXES. Produces no .sis of its own.
NAME=ddbtsk
VENDOR="RustSdkDev"
VERSION=0,1,0
UID3=0xE0DD0071

# Headless daemon: no Avkon, no window group, no registration resource. It runs, writes its
# section and exits. HEADLESS=1 turns the missing _reg.rss from an error into the intent.
USE_SHIM=0
USE_SHIM_DAEMON=1
HEADLESS=1
RUST_CRATE=device

# Base libraries only. USE_BTSOCK adds the three this probe exists to test — esock and
# bluetooth for the RFCOMM socket, sdpdatabase for the SDP record — rather than naming them
# here, because a library list in two places is a library list that drifts. This is NOT
# USE_BT: the registry side (btmanclient/btdevice) is a different, already-proven set, and a
# probe carries only the imports its own question needs.
SYMBIAN_LIBS="euser efsrv estor"
USE_BTSOCK=1

# The whole point of the probe. libsweep proved esock and bluetooth open; it says nothing
# about sdpdatabase, or about whether the ordinals RSdp/RSdpDatabase call exist on a 2009
# build — and an import that does not resolve stops the image loading with no error, no log
# and no report file. A BEGIN in dump-71-btsock.txt means the three resolved.
#
# LocalServices is the capability an RFCOMM server and an SDP write are gated on; it is the
# one an unsigned app is most likely to be refused, and Listen is where that shows. The
# handset is ROM-patched and grants all twenty, so this list is minimality, not necessity.
CAPABILITIES=LocalServices+ReadDeviceData+WriteDeviceData
SIGN=0

# Trace the whole run: this probe's most likely failure is dying before it writes anything,
# and C:\Data\logs_ddbtsk.txt is the only place a last breath would land.
DEBUG=1
