# msvev — the only resident probe, and the second one that writes.
#
# It opens a Message Server session, switches on event delivery, and then sits watching while
# the operator replies to one of our messages in the Messaging application. That is not
# laziness about automation: a session event is dispatched by an active object, so it needs a
# scheduler that idles, and the event this probe exists to catch is caused by a person using
# another application.
#
# It also writes one entry of its own into Drafts, and that is not incidental: an earlier run
# ended "30s: 0 events" and could not say whether the platform delivers no events or the
# operator had not replied yet. Its own write is a change the Message Server certainly knows
# about, so hearing nothing about it would indict our side rather than the platform's. The
# entry is named "safe to delete" and left behind, like the mtm probe's.
#
# It answers the three things crates/symbian-mtm's design rests on and nothing measures —
# whether a session event crosses a process boundary at all, which sub-kinds arrive and in what
# order relative to the body being committed, and which folder MCE passes to ReplyL.
NAME=ddmsvev
VENDOR="Pizzaria Foundation"
VERSION=0,1,0
UID3=0xE0DD0063

USE_SHIM=0
USE_SHIM_DAEMON=1
HEADLESS=1
RUST_CRATE=device

# The same import set as the msg probe, for the same reason: msgs.dso is the one library on
# this handset that might not satisfy us, and a binary that fails to load costs only its own
# section. estor and etext are for the CRichText the body goes through, reading and writing.
SYMBIAN_LIBS="euser efsrv estor"
USE_MSG=1

# Reading the user's messages, and the registration resource lives under \resource\.
CAPABILITIES="ReadUserData+WriteUserData+ReadDeviceData+WriteDeviceData"
SIGN=0
