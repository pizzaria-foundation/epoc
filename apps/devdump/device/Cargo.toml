[package]
name = "devdump-device"
version = "0.1.0"
edition = "2021"
publish = false

# Its own workspace root: a no_std staticlib carrying a #[panic_handler] collides with
# std's when cargo builds the test harness.
[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
devdump = { path = ".." }
symbian-app = { path = "../../../crates/symbian-app" }

[features]
# Named by app.conf's DEV_BRIDGE_FEATURE; symbuild enables it only when EPOCADB_HOST is set.
dev-bridge = ["devdump/dev-bridge"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
