# devdump — the launcher. One install, one report.
#
#   tools/epoc build apps/devdump/probes/<name>   for each probe, then
#   tools/epoc build apps/devdump                 to package them all together
#
# The probes are ordinary headless executables bundled through EXTRA_EXES, plus the
# polymorphic DLL the `dll` probe loads at runtime, bundled through EXTRA_DLLS. One
# install puts all of them in \sys\bin and one uninstall removes them.

NAME=devdump
VENDOR="Pizzaria Foundation"
VERSION=0,1,0
UID3=0xE0DD0000

USE_SHIM=1
RUST_CRATE=device

# Launching and polling the probes. This, plus the base GUI set, is the launcher's whole
# import list — it must always load, because it is the one binary whose failure costs the
# entire run.
USE_PROC=1
USE_MEM=1

# NO socket set. It used to link esock/insock/commdb/netmeta for the dev bridge, which was the
# one place the "the launcher must always load" rule was bent — for a facility that was never
# once confirmed against a real handset. The bridge is gone (the log is a file now, read over
# ADBian), and with it five imports out of the binary whose failure would cost the entire run.

# No capability of its own. Creating a process is not a privileged act; each probe declares
# what it needs and gets it regardless of what the launcher holds.
CAPABILITIES=none
HEAP=0x1000,0x400000

# The fleet. Each is built by its own app.conf under probes/, and produces no .sis of its
# own — see tools/symbuild's TARGETTYPE and EXTRA_EXES blocks.
EXTRA_EXES="probes/system/build/ddsystem.exe \
probes/libsweep/build/ddlibs.exe \
probes/caps/build/ddcaps.exe \
probes/dll/build/dddll.exe \
probes/net/build/ddnet.exe \
probes/fs/build/ddfs.exe \
probes/bt/build/ddbt.exe \
probes/msg/build/ddmsg.exe \
probes/mtm/build/ddmtm.exe \
probes/ncn/build/ddncn.exe \
probes/msvev/build/ddmsvev.exe"

# The mtm probe's registration resource. It has to be named here and not only in that
# probe's own app.conf: EXTRA_EXES copies the executable and nothing else, so a resource
# built alongside a bundled probe lands in a .sis nobody installs. That cost one trip — the
# probe reported "NOT INSTALLED" rather than blaming the Message Server, which is the only
# reason it cost one and not two.
EXTRA_MTM_RESOURCES="../mtmdemo/build/mtmdemoreg.mtmrsc"

# The UI-data component's runtime files. CBaseMtmUiData opens both during construction,
# inside whichever application draws a message list, so a package that carries the DLL and
# not these installs a component that Leaves the moment the Messaging application touches it.
EXTRA_MSG_RESOURCES="../mtmdemo/build/mtmdemo.uirsc \
../mtmdemo/build/mtmdemo.mbm"

# The DLL the `dll` probe loads with RLibrary::Load. Loaded, never linked: a DLL that will
# not load costs that one probe's section and nothing else.
EXTRA_DLLS="../dlltest/build/dlltest.dll \
../mtmdemo/build/mtmdemo.dll"

DEBUG=1
SIGN=0
