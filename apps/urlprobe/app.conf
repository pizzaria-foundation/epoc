# Build manifest, read by tools/symbuild.

NAME=urlprobe
VENDOR="RustSdkDev"
VERSION=0,1,0

# 0xE is the unprotected development block. This one value becomes three things that must
# agree: the E32 header UID3, the UID3 in data/urlprobe_reg.rss, and KUidShimApp in the
# shim (via -DSHIM_APP_UID3). symbuild wires all three.
UID3=0xEC4C5533

# Declare only what the binary uses. A capability an app does not need is a capability the
# user is asked to trust for no reason — and an unsigned package declaring a protected one
# will not install on a stock phone at all.
CAPABILITIES=none

USE_SHIM=1

# The whole point of this probe: ask an app to open a URL, in isolation. USE_APPARC brings in
# RApaLsSession (list apps, launch); USE_LAUNCH_DOC compiles the four launch-with-document routes in
# shim_apparc.cpp. Every other binary links the off-stub for those, so the risk is confined to a
# non-resident app that can simply be reopened if it dies — the rule this repo learned the hard way
# by bisecting an icon panic inside the resident launcher.
USE_APPARC=1
USE_LAUNCH_DOC=1
CXX_SOURCES=""
RUST_CRATE=device

HEAP=0x1000,0x200000
STACK=0x8000

# Debug logging. 1 makes every `symbian::log!("…")` in this app append to
# C:\Data\_logs\urlprobe.txt — no capability, no host, readable off the phone afterwards. 0 removes
# those call sites entirely, format strings included, so leaving them in the source costs a
# release build nothing. Write the lines as you go; flip this when you need them.
DEBUG=1

# The dev handset runs a patched installserver; see tools/symbuild.
SIGN=0
