# recoglaunch — an ECom AppArc data-recogniser that launches the launcher early in boot.
#
#   tools/epoc build apps/recoglaunch   -> apps/recoglaunch/build/recoglaunch.dll
#                                         apps/recoglaunch/build/recoglaunch.ecomrsc
#
# Phase A' of the "launch the launcher early via a recogniser" work. The E72 only loads ECom
# recognisers (every recogniser in its ROM has UID2 0x10009D8D; the legacy 0x10003a19 scan is
# off — measured). So this is an ECom plugin: ECom reads recoglaunch.rss from \resource\plugins,
# loads the DLL, and calls the factory to instantiate our recogniser. It recognises nothing;
# on construction it appends "boot ntick=.. tick=.." to C:\Data\recog_probe.txt. Reading that
# file after a real (physical) reboot tells us WHEN/IF the ECom factory runs at boot. No .sis:
# the DLL goes to C:\sys\bin and the .rsc to C:\resource\plugins, pushed over rshell.

NAME=recoglaunch
VENDOR="Pizzaria Foundation"
VERSION=0,1,0
# UID3 is also the implementation_uid and the .rss basename — keep the three in step.
UID3=0xE0DD00F4

TARGETTYPE=DLL

# The ECom plugin second UID (targettype PLUGIN). NOT the legacy recogniser 0x10003a19 — that
# one this handset ignores.
UID2=0x10009D8D

# ECom finds ImplementationGroupProxy at ordinal 1; one export makes the name-sort a no-op so
# ordinal 1 is guaranteed. See ECOM_RECOG_EXPORT in shim/recog/inc/recogbase.h.
EXPORTS="ImplementationGroupProxy"

USE_SHIM=0
CXX_SOURCES="src/recoglaunch.cpp"
# Compiles the shared recogniser base (shim/recog). The base class is the same for legacy and
# ECom recognisers; only the export macro differs.
USE_RECOG=1

# The ECom REGISTRY_INFO resource, compiled to recoglaunch.ecomrsc and installed to
# \resource\plugins\recoglaunch.rsc by whoever bundles this (or pushed directly over rshell).
ECOM_RESOURCE=data/recoglaunch.rss

# apmime carries CApaDataRecognizerType (ctor/dtor/recognise surface), present on the E72.
# efsrv for the RFs/RFile the probe appends with; euser is the base. The plugin does NOT call
# ECom itself (it is loaded BY ecom), so ecom.dso is not linked. No default set (USE_SHIM=0).
SYMBIAN_LIBS="euser apmime efsrv"

# A DLL must hold at least the capabilities of the process that loads it (the mtmdemo lesson);
# ECom's host loads this. Full ROM-granted set minus TCB.
CAPABILITIES="CommDD+PowerMgmt+MultimediaDD+ReadDeviceData+WriteDeviceData+DRM+TrustedUI+ProtServ+DiskAdmin+NetworkControl+AllFiles+SwEvent+NetworkServices+LocalServices+ReadUserData+WriteUserData+Location+SurroundingsDD+UserEnvironment"
SIGN=0
