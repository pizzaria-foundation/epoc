[package]
name = "ghprobe-device"
version = "0.1.0"
edition = "2021"
publish = false

# Its own workspace root: a no_std staticlib carrying a #[panic_handler] collides with std's when
# cargo builds the test harness.
[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
ghprobe = { path = ".." }
symbian-app = { path = "../../../crates/symbian-app" }
