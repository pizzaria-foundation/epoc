# ghprobe — one question: does api.github.com answer this phone?
#
# The package manager's repository feature is designed around GitHub Releases, and every part of
# "JSON from api.github.com over TLS 1.2" is a claim about a 2009 handset rather than about our code.
# This asks before anything is built on the answer. One binary, one risky import — the rule in
# docs/device-notes.md.
#
# What is already measured (docs/plan-browser.md, 2026-08-24): https://github.com/ answers 200 through
# RHTTPSession, because the patched ssl.dll routes CSecureSocket into mbedtls 3.4.1 and gives the whole
# device TLS 1.2. What is not measured is this host, its certificate, and whether the API accepts the
# User-Agent the shim sends.

NAME=ghprobe
VENDOR="Pizzaria Foundation"
VERSION=0,1,0
UID3=0xE0DD00FA

RUST_CRATE=device

# The async HTTP stack — RHTTPSession, the same one apps/browser uses. Deliberately NOT symbian::tls:
# that is mbedTLS direct, it is blocking, and its certificate verification is off. This path validates
# through CSecureSocket.
USE_HTTP=1
# Bearer bring-up. Attach first, so a phone already online needs no dialog.
USE_NET=1

USE_SHIM_DAEMON=1
HEADLESS=1

# Copied from apps/httpprobe, which is the binary that proved this list works for RHTTPSession.
SYMBIAN_LIBS="euser efsrv estor hal esock insock commdb netmeta http inetprotutil bafl apgrfx cone ws32"

HEAP=0x1000,0x400000
STACK=0x8000

CAPABILITIES="NetworkServices ReadDeviceData WriteDeviceData"

# The whole output of this binary is its log.
DEBUG=1
SIGN=0
