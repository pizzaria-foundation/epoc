[package]
name = "symbian-preview"
description = "Host-side contact sheets: render a screen to PNG so it can be looked at without a device"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
symbian-gfx = { workspace = true }
symbian-ui = { workspace = true }

[dev-dependencies]
# For the harness's own tests: `testing::with_theme` builds a Theme over a one-glyph atlas, which is
# all `compare` needs — it reads two metrics off it. The real atlases are what callers pass in.
symbian-ui = { workspace = true, features = ["testing"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_vendor, values("symbian"))'] }
