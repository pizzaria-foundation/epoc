[package]
name = "symbian-bootctl"
description = "The boot manager's screens: edit the boot order, policies, and read the last boot"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The same split as symbian-launcher ↔ apps/launcher: the screens are a widget, the app is the
# device glue. This crate does no file I/O at all — it is handed a config and hands one back — which
# is what lets every screen test be a plain `cargo test`.
[dependencies]
symbian = { workspace = true }
symbian-ui = { workspace = true }
symbian-bootcfg = { workspace = true }

[dev-dependencies]
symbian-ui = { workspace = true, features = ["testing"] }
# The preview example renders the screens to PNG; same machinery every other screen crate uses.
symbian-preview = { workspace = true }
symbian-gfx = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_vendor, values("symbian"))'] }
