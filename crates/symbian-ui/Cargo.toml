[package]
name = "symbian-ui"
description = "Widget toolkit for keypad-driven Symbian devices"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
std = ["symbian-gfx/std"]
# Host test helpers: a valid one-glyph atlas and a Theme builder. Behind a feature so
# nothing in it reaches a device binary; apps enable it under [dev-dependencies], which
# the device build never sees at all.
testing = []

[dependencies]
symbian-gfx = { workspace = true }
# For ShimEvent, which App::handle_raw hands through unchanged. The toolkit was
# deliberately ABI-free for a while; the cost was a second, identical RawEvent in
# `symbian` and a field-by-field copy between them at every call site, which is worse
# than the coupling. symbian-sys is no_std, dependency-free and builds for the host.
symbian-sys = { workspace = true }
